name: Terraform

on:
  push:
    branches: [master]
  pull_request:

# Least-privilege default: neither job needs to write anything back to the
# repo or call other APIs, so the GITHUB_TOKEN gets read-only checkout access
# and nothing else, regardless of org/repo-level token defaults.
permissions:
  contents: read

jobs:
  validate:
    name: fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init (no backend, no credentials needed)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

  security-scan:
    name: tfsec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
