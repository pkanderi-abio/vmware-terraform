# admin-user for the Kubernetes Dashboard -- cluster-admin bound, token-based
# login only (no password, no long-lived kubeconfig embedded anywhere).
# Generate a login token on demand, don't store one in state:
#   kubectl -n kubernetes-dashboard create token admin-user --duration=24h
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-user
  namespace: kubernetes-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-user
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: admin-user
    namespace: kubernetes-dashboard
